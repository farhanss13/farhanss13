<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Farhan Saqib - Software Engineer, Full-Stack and Flutter Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox" spreadMethod="reflect">
      <stop offset="0" stop-color="#1F4E79"/>
      <stop offset="0.5" stop-color="#2E8B8B"/>
      <stop offset="1" stop-color="#1F4E79"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="240"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
    .name{font-size:68px;font-weight:700;letter-spacing:2px;opacity:0;animation:rise 1.2s ease-out .2s forwards}
    .sub{font-size:26px;opacity:0;animation:rise 1.2s ease-out .8s forwards}
    .loc{font-size:18px;opacity:0;animation:rise 1.2s ease-out 1.3s forwards}
    .bar{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:grow 1s ease-out 1s forwards}
    .o1{animation:float1 9s ease-in-out infinite}
    .o2{animation:float2 11s ease-in-out infinite}
    .o3{animation:float1 13s ease-in-out infinite reverse}
    .o4{animation:float2 8s ease-in-out infinite reverse}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes grow{to{transform:scaleX(1)}}
    @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,22px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-20px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="240" fill="url(#g)"/>
    <circle class="o1" cx="1080" cy="40" r="150" fill="#fff" fill-opacity="0.07"/>
    <circle class="o2" cx="1150" cy="210" r="110" fill="#fff" fill-opacity="0.07"/>
    <circle class="o3" cx="90" cy="230" r="120" fill="#fff" fill-opacity="0.06"/>
    <circle class="o4" cx="300" cy="30" r="60" fill="#fff" fill-opacity="0.05"/>
    <circle class="o2" cx="860" cy="200" r="70" fill="#fff" fill-opacity="0.05"/>
  </g>
  <text class="t name" x="600" y="108">Farhan Saqib</text>
  <rect class="bar" x="520" y="126" width="160" height="4" rx="2" fill="#fff" fill-opacity="0.8"/>
  <text class="t sub" x="600" y="171">Software Engineer  |  Full-Stack &amp; Flutter Developer</text>
  <text class="t loc" x="600" y="206" fill-opacity="0.85">Lahore, Pakistan</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
